<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ORIX — Design preview</title><link rel="stylesheet" href="orix-preview.css"></head><body>
<div class="prototype" id="prototype">DESIGN PREVIEW · SAMPLE DATA · NO SYSTEM CHANGES</div>
<div class="shell"><aside><div class="brand"><img src="../../assets/settings-icon-64.png" alt=""><div><b>ORIX</b><small id="brandSub">Desktop interaction layer</small></div></div><nav aria-label="Main navigation" id="nav"></nav><div class="aside-bottom"><strong>ORIX 0.1.0 beta</strong><br><span id="freeLabel">Free. Open source. Yours.</span><br><span class="caps">WINDOWS DESKTOP LAYER</span></div></aside>
<main><header><small id="breadcrumb">WORKSPACE / OVERVIEW</small></header><div id="content"></div><div id="savebar"></div></main></div>
<script src="../../orix-icons-ui.js"></script>
<script>
// Disposable design prototype: all controls affect this tab only; no Electron or provider APIs.
const $=s=>document.querySelector(s);let page='overview',section='general',lang='en',visible=true,theme='dark',motion='system',dirty=false,compact=false;
const words={en:{overview:'Overview',appearance:'Appearance',modules:'Modules',settings:'Settings',tag:'Desktop interaction layer',free:'Free. Open source. Yours.',hello:'Your desktop.<br>Within reach.',intro:'A quiet place for everything you do. Your tools, one interaction away.',layer:'Desktop layer',on:'Visible',off:'Hidden',explain:'Your tools and integrations keep running when the layer is hidden.',preview:'DESKTOP PREVIEW',reach:'Everything in reach.',smart:'A smarter interaction layer.',expanded:'Expanded',compact:'Compact',tools:'Your everyday tools',all:'View all modules',note:'Quick note',focus:'Focus timer',clipboard:'Clipboard',music:'Media controls',open:'Open',ready:'Ready when you are',setup:'Connections',setupp:'Connect your existing AI tools and keep their status within reach.',manage:'Manage connections',activity:'Recent activity',empty:'No activity yet. Completed tasks will appear here.',sample:'Preview uses sample data',custom:'Make it feel like you.',customp:'One visual language, from your control center to the desktop.',color:'Color theme',colorp:'Use a fixed appearance or follow Windows.',dark:'Dark',light:'Light',system:'System',animation:'Motion',animationp:'Respect your system setting or reduce interface animation.',full:'Full',reduced:'Reduced',status:'Status colors',statusp:'Distinct colors and labels for every state.',busy:'Working',done:'Done',error:'Error',sleep:'Sleep when idle',sleepp:'Keep the layer quiet between interactions.',personal:'Preview your desktop layer',moduleTitle:'A place for every tool.',moduleIntro:'Choose what is available in your desktop layer. Every built-in tool is free.',always:'Always available',enabled:'Enabled',general:'General',connections:'Connections',ai:'AI & Chat',updates:'Updates',about:'About',settTitle:'A little more control.',settIntro:'Set up ORIX around the way you work.',language:'Language',languagep:'Used throughout the dashboard and desktop layer.',startup:'Start with Windows',startupp:'Have ORIX ready when you sign in.',notifications:'Windows notifications',notifyp:'Stay informed when an AI task or Focus session finishes.',shortcuts:'Keyboard shortcuts',shortcutp:'Quick access to the existing desktop tools.',save:'Save changes',cancel:'Cancel',unsaved:'Preview changes · not connected to the app',saved:'Preview saved · no system changes',manual:'Manual updates',manualp:'Choose when to install a release. Automatic checks and downloads are disabled.',repo:'STiFLeR7 / ORIX',license:'Free and open source under the ISC license.',connectp:'Integration status and setup stay together here.',connect:'Set up',notconnected:'Not connected',context:'Desktop context',tray:'File tray',clock:'Clock',core:'Core',keyhint:'Existing shortcuts respect the layer visibility setting.'}};
const symbols={overview:'home',appearance:'appearance',modules:'grid',settings:'settings'};const w=()=>words[lang];
const icon=name=>ORIXIcons.html(name).replaceAll('src="assets/','src="../../assets/');
const button=(label,action,cls='btn')=>`<button class="${cls}" data-action="${action}">${label}</button>`;
const switcher=(id,on=true,disabled=false)=>`<button class="small-switch" role="switch" aria-label="${id}" aria-checked="${on}" data-switch="${id}" ${disabled?'disabled':''}></button>`;
function row(title,desc,control,symbol=''){return `<div class="row">${symbol?`<span class="symbol" aria-hidden="true">${icon(symbol)}</span>`:''}<div class="info"><h3>${title}</h3><p>${desc}</p></div>${control}</div>`}
function desktop(){const t=w();return `<div class="desktop"><small>${t.preview}</small><div class="island ${visible?'':'hidden'} ${compact?'compact':''}"><div class="island-top"><img src="../../assets/settings-icon-64.png" alt="ORIX"><span>ORIX</span><span>${icon('wifi')}</span></div><h3>${t.reach}</h3><p>${t.smart}</p></div><div class="desktop-caption">${visible?t.ready:t.off}<div class="preview-choice">${button(t.compact,'compact','textbutton')}${button(t.expanded,'expanded','textbutton')}</div></div></div>`}
function heading(title,desc){return `<div class="intro"><h1>${title}</h1><p>${desc}</p></div>`}
function segments(id,options,value){return `<div class="segmented" role="group">${options.map(([key,label])=>`<button data-${id}="${key}" class="${key===value?'selected':''}" aria-pressed="${key===value}">${label}</button>`).join('')}</div>`}
function render(){const t=w();document.documentElement.lang=lang;document.documentElement.dataset.theme=theme;$('#brandSub').textContent=t.tag;$('#freeLabel').textContent=t.free;$('#breadcrumb').textContent='ORIX / '+t[page].toUpperCase();$('#nav').innerHTML=Object.keys(symbols).map(k=>`<button class="nav ${k===page?'active':''}" data-page="${k}" ${k===page?'aria-current="page"':''}><span aria-hidden="true">${icon(symbols[k])}</span>${t[k]}</button>`).join('');let html='';
if(page==='overview')html=heading(t.hello,t.intro)+`<div class="layout"><div><div class="layer-control"><div class="control-top"><h2>${t.layer}</h2><span class="status"><i class="dot ${visible?'':'off'}"></i>${visible?t.on:t.off}</span></div><button class="switch" role="switch" aria-label="${t.layer}" aria-describedby="switch-help" aria-checked="${visible}" data-action="visibility">${visible?'ON':'OFF'}<i></i></button><p class="control-note" id="switch-help">${t.explain}</p></div><section class="section"><div class="section-head"><h2>${t.tools}</h2>${button(t.all,'modules','textbutton')}</div><div class="rows">${row(t.note,t.ready,button(t.open,'tool-note'),'note')}${row(t.focus,'25:00',button(t.open,'tool-focus'),'focus')}${row(t.clipboard,t.ready,button(t.open,'tool-clipboard'),'clipboard')}</div></section></div><div>${desktop()}<div class="right-note"><b>${t.setup}</b><div class="provider-icons">${icon('claudecode')}${icon('codex')}${icon('chatgpt')}${icon('claude')}</div><p>${t.setupp}</p>${button(t.manage,'connections','textbutton')}</div></div></div><section class="section"><div class="section-head"><h2>${t.activity}</h2><span class="caps">${t.sample}</span></div><p class="empty">${t.empty}</p></section>`;
if(page==='appearance')html=heading(t.custom,t.customp)+`<div class="layout"><div class="rows">${row(t.animation,t.animationp,segments('motion',[['full',t.full],['reduced',t.reduced],['system',t.system]],motion))}${row(t.status,t.statusp,`<span class="tag"><span style="color:#ff9a1f">●</span> ${t.busy} &nbsp;<span style="color:#22e05a">●</span> ${t.done} &nbsp;<span style="color:#ff3b3b">●</span> ${t.error}</span>`)}${row(t.sleep,t.sleepp,switcher(t.sleep))}</div><div>${desktop()}<p class="right-note">${t.personal}</p></div></div>`;
if(page==='modules'){const modules=[['claude','AI',true],['buddy',t.context],['spotify','Spotify'],['focus',t.focus],['tray',t.tray],['clips',t.clipboard],['note',t.note],['clock',t.clock],['settings',t.settings,true]];html=heading(t.moduleTitle,t.moduleIntro)+`<div class="feature-grid">${modules.map(([id,title,core])=>row(title,core?t.always:t.enabled,core?`<span class="tag">${t.core}</span>`:switcher(title),({claude:'ai',buddy:'context',spotify:'spotify',focus:'focus',tray:'tray',clips:'clipboard',note:'note',clock:'clock',settings:'settings'})[id])).join('')}</div><p class="notice">${t.sample}</p>`}
if(page==='settings'){html=heading(t.settTitle,t.settIntro)+`<div class="settings-nav">${['general','connections','ai','updates','about'].map(k=>`<button data-section="${k}" class="${section===k?'active':''}">${t[k]}</button>`).join('')}</div>`;if(section==='general')html+=`<div class="rows">${row(t.color,t.colorp,segments('theme',[['light',t.light],['dark',t.dark],['system',t.system]],theme))}${row(t.startup,t.startupp,switcher(t.startup,false))}${row(t.notifications,t.notifyp,switcher(t.notifications))}${row(t.shortcuts,t.shortcutp,`<span class="key">Ctrl + Alt + 1…6</span>`)}</div><p class="notice">${t.keyhint}</p>`;if(section==='connections'||section==='ai')html+=`<p class="notice">${t.connectp}</p><div class="rows">${[['claudecode','Claude Code'],['codex','Codex'],['chatgpt','ChatGPT'],['claude','Claude']].map(([id,name])=>row(name,t.notconnected,button(t.connect,'sample'),id)).join('')}</div>`;if(section==='updates')html+=`<div class="rows">${row('ORIX 0.1.0-beta.1',t.manual,'<span class="tag">ISC</span>','download')}</div><p class="notice">${t.manualp}</p>${button(t.repo,'sample','textbutton')}`;if(section==='about')html+=`<div class="rows">${row('ORIX',t.tag,'<span class="tag">0.1.0 beta</span>','settings')}</div><p class="notice">${t.license}</p>${button(t.repo,'sample','textbutton')}`}
$('#content').innerHTML=html;$('#savebar').innerHTML=dirty?`<div class="savebar"><small>${t.unsaved}</small>${button(t.cancel,'cancel')}${button(t.save,'save','btn primary')}</div>`:'';
}
let committed={theme,lang,motion};document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;render();return}if(b.id==='theme'){theme=theme==='dark'?'light':'dark';render();return}if(b.dataset.section){section=b.dataset.section;render();return}if(b.dataset.theme){theme=b.dataset.theme==='system'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):b.dataset.theme;dirty=true}if(b.dataset.motion){motion=b.dataset.motion;dirty=true}if(b.dataset.switch){b.setAttribute('aria-checked',b.getAttribute('aria-checked')!=='true');dirty=true;$('#savebar').innerHTML=`<div class="savebar"><small>${w().unsaved}</small>${button(w().cancel,'cancel')}${button(w().save,'save','btn primary')}</div>`;return}switch(b.dataset.action){case'visibility':visible=!visible;break;case'compact':compact=true;break;case'expanded':compact=false;break;case'modules':page='modules';break;case'connections':page='settings';section='connections';break;case'cancel':({theme,lang,motion}=committed);dirty=false;break;case'save':committed={theme,lang,motion};dirty=false;break;default:if(b.dataset.action){$('#prototype').textContent='DESIGN PREVIEW · '+w().sample+' · '+b.textContent;return}}render()});render();
</script></body></html>
